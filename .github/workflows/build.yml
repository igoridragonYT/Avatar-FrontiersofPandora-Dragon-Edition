name: Build Minecraft Mod

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build mod
        run: gradle build

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: Avatar-FrontiersofPandora-Dragon-Edition
          path: build/libs/*.jar

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Avatar: Frontiers of Pandora - Dragon Edition v1.0.${{ github.run_number }}
          body: |
            ## Avatar: Frontiers of Pandora - Dragon Edition

            Minecraft 1.20.1 Forge

            Automated release from GitHub Actions.
          files: build/libs/*.jar
          generate_release_notes: true