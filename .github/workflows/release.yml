name: Create Mod Release

on:
  workflow_run:
    workflows: ["Build Minecraft Mod"]
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: Avatar-FrontiersofPandora-Dragon-Edition
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.workflow_run.id }}
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Avatar: Frontiers of Pandora - Dragon Edition v1.0.${{ github.run_number }}
          body: |
            ## Avatar: Frontiers of Pandora - Dragon Edition

            Minecraft 1.20.1 Forge

            Automated release from GitHub Actions.
          files: release/*.jar
          generate_release_notes: true